<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="color-scheme" content="light" />

    <!-- Title, description, canonical and the og/twitter tags are set per route
         via <svelte:head>. They must not also live here: this markup is emitted
         before %sveltekit.head%, and a crawler takes the first occurrence, so a
         default here silently overrides every post. -->

    <meta name="twitter:site" content="@PlantSecurity" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Gaanesh — Blog",
        "url": "https://blog.gaanesh.com",
        "author": {
          "@type": "Person",
          "name": "Gaanesh Theivasigamani",
          "url": "https://gaanesh.com"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">
      %sveltekit.body%
    </div>
  </body>
</html>
